# /etc/X11/xorg.conf.d/10-hpfx.conf
# Xorg configuration for HP Visualize FX5 / FX10

Section "Device"
    Identifier  "HP Visualize FX"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "ShadowFB" "on"
EndSection

Section "Screen"
    Identifier  "Default Screen"
    Device      "HP Visualize FX"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1600x1200" "1280x1024" "1024x768" "800x600"
    EndSubSection
EndSection
